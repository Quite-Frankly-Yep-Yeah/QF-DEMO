---
# Teacher workflow and student supports (docs/teacher-workflow-plan.md).
# Every flag starts hidden. Each track has its own umbrella flag so a school
# can adopt one without the other; phase flags are added as their phases ship.
student_supports:
  applies_to: RootAccount
  state: hidden
  display_name: Student Supports
  description: |-
    Umbrella flag for 504, IEP and English-learner supports: plans,
    accommodations and the need-to-know access rules that protect them.
supports_plans:
  applies_to: Account
  state: hidden
  display_name: "Student Supports: Plans and Accommodations"
  description: |-
    Support plans, the accommodation catalog, the accommodations card for
    teachers, acknowledgements, caseloads and the plan import.
supports_accommodations_apply:
  applies_to: Account
  state: hidden
  display_name: "Student Supports: Accommodations That Act"
  description: |-
    Applies accommodations for the student: extended time and extra attempts
    on quizzes, the pacing change, and display settings. Each change is
    recorded for the case manager.
teacher_workflow:
  applies_to: RootAccount
  state: hidden
  display_name: Teacher Workflow
  description: |-
    Umbrella flag for the teacher workflow tools: the grading queue,
    follow-ups, the student page and progress reports.
workflow_grading_queue:
  applies_to: Account
  state: hidden
  display_name: "Teacher Workflow: Grading Queue"
  description: |-
    One page that lists the grading a teacher can do across their courses,
    ranked so the work that holds students back comes first, with a grading
    turnaround number and a backlog alert for admins.
